name: Publish packages
# Publishes the exact files of a GitHub release to npm (@method-ai-hq/sdk) and PyPI (withmethod), with trusted
# publishing: npm and PyPI trust this workflow, so no token is stored. A version that is already published is skipped.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.14.1
        required: true
permissions:
  contents: read
concurrency:
  group: publish-packages
  cancel-in-progress: false
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Download the release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern 'method-ai-hq-sdk-*.tgz' --dir dist
      - name: Publish to npm
        run: |
          file=$(ls dist/method-ai-hq-sdk-*.tgz)
          version=${TAG#v}
          if npm view "@method-ai-hq/sdk@$version" version >/dev/null 2>&1; then echo "@method-ai-hq/sdk@$version is already on npm."; exit 0; fi
          npm publish "$file" --access public --provenance
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern 'withmethod-*.whl' --dir dist
      - name: Check whether this version is on PyPI
        id: check
        run: |
          version=${TAG#v}
          if curl -sf "https://pypi.org/pypi/withmethod/$version/json" >/dev/null; then echo "withmethod $version is already on PyPI."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
