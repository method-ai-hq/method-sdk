name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run release:build
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./packages/sdk/package.json").version')
          gh release create "v$version" dist/release-assets/* --target "$GITHUB_SHA" --title "SDK $version" --notes-file CHANGELOG.md
