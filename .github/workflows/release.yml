name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run release:build
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./packages/sdk/package.json").version')
          tag="v$version"
          if gh release view "$tag" --json isDraft,targetCommitish > /tmp/release.json 2>/dev/null; then
            node -e 'const r=require("/tmp/release.json"); if(!r.isDraft || r.targetCommitish!==process.env.GITHUB_SHA) process.exit(1)'
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "SDK $version" --notes-file CHANGELOG.md
          fi
          for file in dist/release-assets/*; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$file" --clobber; then uploaded=true; break; fi
              sleep 5
            done
            if [[ "$uploaded" != true ]]; then exit 1; fi
          done
          gh release edit "$tag" --draft=false
